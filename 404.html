<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı | PARSEL AI</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121a2c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='5' fill='%23121a2c'/%3E%3Cpath d='M7 9.5 18.5 7.5 20.5 20 8.5 21.5Z' fill='%238aa9f7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* Layout: ana sitenin koyu zemini; tek mesaj, tek eylem */
:root {
  --ink: #121a2c;
  --on-dark: #e8ecf4;
  --on-dark-muted: #9aa6bf;
  --accent: #2f5fd0;
  --accent-dk: #8aa9f7;
  --f-display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; display: grid; place-items: center; padding: 24px;
  background: var(--ink); color: var(--on-dark); font-family: var(--f-body); line-height: 1.6;
  background-image: linear-gradient(rgba(138, 169, 247, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(138, 169, 247, .07) 1px, transparent 1px);
  background-size: 48px 48px;
}
main { max-width: 520px; display: grid; gap: 18px; }
.code { margin: 0; font-size: .95rem; color: var(--accent-dk); }
h1 { margin: 0; font-family: var(--f-display); font-stretch: 112%; font-weight: 820; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.05; letter-spacing: -.02em; }
p { margin: 0; color: var(--on-dark-muted); }
a.btn {
  justify-self: start; padding: .8rem 1.25rem; border-radius: 6px;
  background: var(--accent); color: #fff; font-weight: 600; text-decoration: none;
}
a.btn:hover { background: #2550b8; }
a:focus-visible { outline: 2px solid var(--accent-dk); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code">Hata 404</p>
  <h1>Bu sayfayı bulamadık.</h1>
  <p>Bağlantı eskimiş ya da yanlış yazılmış olabilir.</p>
  <a class="btn" href="/">Ana sayfaya dön</a>
</main>
</body>
</html>
